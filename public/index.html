<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore books, discover new reads and share reviews with the Bookmark community."
    />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Bookmark</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="container">
      <!-- SITE HEADER -->
      <nav class="site-header mt-4 d-flex justify-content-between">
        <!-- LOGO-LINK -->
        <div class="brand d-flex align-items-center gap-1">
          <a href="/" class="logo d-flex align-items-center gap-2 text-decoration-none text-white">

                fill="#F5EEEE"
              />
            </svg>

            <span class="m-0 lh-1 text-uppercase fs-1">Bookmark</span>
          </a>
        </div>
        <!-- LOGIN BTN -->
        <button
          aria-label="Log in"
          id="login-btn"
          class="border-0 bg-transparent"
          data-bs-toggle="modal"
          data-bs-target="#login-modal"
        >
          <svg width="24" height="24" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M15 0C6.72 0 0 6.72 0 15C0 23.28 6.72 30 15 30C23.28 30 30 23.28 30 15C30 6.72 23.28 0 15 0ZM15 27C12.39 27 9.99 26.16 8.025 24.75C9.99 23.34 12.39 22.5 15 22.5C17.61 22.5 20.01 23.34 21.975 24.75C20.01 26.16 17.61 27 15 27ZM24.21 22.68C21.5823 20.6193 18.3394 19.4994 15 19.4994C11.6606 19.4994 8.41774 20.6193 5.79 22.68C3.98572 20.5278 2.99784 17.8085 3 15C3 8.37 8.37 3 15 3C21.63 3 27 8.37 27 15C27 17.925 25.95 20.595 24.21 22.68Z"
              fill="#F5EEEE"
            />
            <path
              d="M15 5.89499C12.105 5.89499 9.75 8.24999 9.75 11.145C9.75 14.04 12.105 16.395 15 16.395C17.895 16.395 20.25 14.04 20.25 11.145C20.25 8.24999 17.895 5.89499 15 5.89499ZM15 13.395C13.755 13.395 12.75 12.39 12.75 11.145C12.75 9.89999 13.755 8.89499 15 8.89499C16.245 8.89499 17.25 9.89999 17.25 11.145C17.25 12.39 16.245 13.395 15 13.395Z"

            />
          </svg>
        </button>
        <!-- MODAL -->
        <div class="user-modal modal" id="login-modal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <!-- AUTH content -->
              <div id="auth-content">
                <!-- LOGIN -->
                <div class="modal-header border-0">
                  <h2 class="modal-title">Login</h2>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                  <form id="login-form">
                    <input
                      id="login-username"
                      name="username"
                      type="text"
                      class="form-control mb-3"
                      placeholder="Username"
                      autocomplete="username"
                    />
                    <div class="d-flex align-items-center gap-2 mb-3">
                      <input
                        id="login-password"
                        name="password"
                        type="password"
                        class="form-control"
                        placeholder="Password"
                        autocomplete="current-password"
                      />
                      <button type="button" class="btn toggle-password" aria-label="Show password">
                        <!-- show -->
                        <svg
                          class="eye-open"
                          width="19"
                          height="14"
                          viewBox="0 0 15 10"
                          fill="none"
                          xmlns="http://www.w3.org/2000/svg"
                        >

                          />
                        </svg>

                        <svg
                          class="eye-closed d-none"
                          width="15"
                          height="14"
                          viewBox="0 0 15 14"
                          fill="none"
                          xmlns="http://www.w3.org/2000/svg"
                        >

                            fill="#DFEDF2"
                          />
                        </svg>
                      </button>
                    </div>
                    <p id="login-message"></p>
                    <button type="submit" class="btn btn-light">Login</button>
                  </form>
                </div>

                <!-- REGISTER -->
                <div class="modal-header mt-4 border-0">
                  <h2 class="modal-title">Create new account</h2>
                </div>
                <div class="modal-body">
                  <form id="register-form">
                    <input
                      id="register-username"
                      type="text"
                      class="form-control mb-3"
                      placeholder="Username"
                      autocomplete="username"
                    />
                    <p id="username-error" class="text-danger"></p>
                    <input
                      id="register-password"
                      type="password"
                      class="form-control mb-3"
                      placeholder="Password"
                      autocomplete="new-password"
                    />
                    <p id="password-error" class="text-danger"></p>
                    <p id="register-message"></p>
                    <button type="submit" class="btn btn-light">Register</button>
                  </form>
                </div>
              </div>

              <!-- LOGGED IN ACCOUNT -->
              <div id="account-content" class="d-none">
                <div class="modal-header border-bottom-0 mt-4">
                  <h2 class="modal-title">My account</h2>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pb-5">
                  <!-- link list -->
                  <ul class="list-unstyled d-flex flex-column gap-1">
                    <li>
                      <a href="settings.html" class="link-hover d-block text-decoration-none text-reset">Settings</a>
                    </li>
                    <li>
                      <a href="library.html" class="link-hover admin-menu-item d-none text-decoration-none text-reset"
                        >Book library</a
                      >
                    </li>
                    <li>
                      <a href="users.html" class="link-hover admin-menu-item d-none text-decoration-none text-reset"
                        >All users</a
                      >
                    </li>
                  </ul>
                  <!-- log out button -->
                  <div class="d-flex justify-content-center mt-4">
                    <button id="logout-btn" class="btn btn-outline-light">Log out</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <div id="welcome-message" class="d-none mt-5">
        <div class="d-flex gap-2 justify-content-center">
          <svg width="24" height="26" viewBox="0 0 24 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path

              stroke-linejoin="round"
            />
          </svg>
          <p class="text-uppercase m-0 d-flex justify-content-center align-center"></p>
        </div>
      </div>

      <!-- BOOKS -->
      <section class="container mt-5">
        <div class="section-header d-flex justify-content-between mb-5 align-items-center flex-wrap flex-md-nowrap">
          <h2 class="">Explore our library</h2>
          <div class="right-header-content d-flex gap-3 align-items-center">
            <!-- Search form -->
            <form id="search-form">
              <div class="input-group-sm flex-nowrap d-flex">
                <span class="input-group-text bg-transparent border-0"
                  ><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">

                      fill="#DFEDF2"
                    /></svg
                ></span>
                <input
                  class="form-control search-input text-white bg-transparent"
                  id="search-input"
                  placeholder="Search book"
                  type="search"
                />
              </div>
            </form>
            <!-- Sort button -->
            <button type="button" id="sort-btn" class="btn" aria-label="Sort books alphabetically">

        </div>
        <div id="books-list" class="row">
          <!-- Books.js will be added here with JavaScript -->
        </div>
      </section>

      <!-- BOOK MODAL -->
      <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title" id="bookModalLabel">Book</h2>

              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body" id="book-details">
              <!-- Book information will be displayed here -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer mt-5 py-4 border-top">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h2 class="m-0 lh-1 text-uppercase">Bookmark</h2>
            <p class="mb-0 mt-2">Discover your next favorite book.</p>
          </div>

          <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <p class="mb-0">&copy; 2026 Bookmark</p>
          </div>
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/functions.js"></script>
    <script src="js/login.js"></script>
    <script src="js/register.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
